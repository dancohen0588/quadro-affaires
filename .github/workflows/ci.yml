# CI de Quadro Affaires (docs/conception.md, section 5.3).
# Pas de Docker sur le poste : c'est ici, sur le runner, que la base Supabase jetable est créée
# pour rejouer toutes les migrations depuis zéro et exécuter les tests pgTAP des droits (RLS).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valeurs factices pour le build et les tests : aucune donnée ni clé réelle en CI.
  APP_MODE: demo
  DEMO_ACCESS_CODE: code-ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  base:
    name: Migrations et tests pgTAP (base éphémère)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer PostgreSQL Supabase et rejouer toutes les migrations depuis zéro
        run: pnpm exec supabase db start
      - name: Tests pgTAP (supabase/tests)
        run: pnpm exec supabase test db
      - name: Arrêter la base
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: Parcours Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  migrations:
    name: Appliquer les migrations au projet distant
    needs: [qualite, base, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Vérifier les secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Secrets Supabase absents (docs/demarrage.md, étape 2.4) : migrations non appliquées."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm exec supabase db push
